name: Monitor Arcium upstream

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/upstream-sync.yml"
      - ".github/scripts/upstream-sync.cjs"
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

concurrency:
  group: arcium-upstream-sync
  cancel-in-progress: false

jobs:
  upstream:
    name: Prepare upstream revision for review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check upstream and maintain review proposal
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const monitor = require('./.github/scripts/upstream-sync.cjs');
            await monitor({github, context, core});
