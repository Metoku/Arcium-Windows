name: One-time Windows Chromium chrome native compile after NTDDI fix

on:
  pull_request:
    paths:
      - .github/workflows/native-chrome-ntddi-retry.yml

permissions:
  contents: read

concurrency:
  group: arcium-ntddi-chrome-retry-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  browser-only:
    name: Retest native Windows chrome target (never installer)
    if: ${{ github.head_ref == 'experiment/second-windows-chrome-compile-20261102' }}
    runs-on: windows-2025
    timeout-minutes: 285
    steps:
      - name: Checkout pinned Arcium Windows integration
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate NTDDI SDK, browser-only targets and launch guardrails
        run: |
          python -m unittest discover -s tests -p test_chromium_sdk_pin.py -v
          python -m unittest discover -s tests -p test_browser_only_build.py -v
          python -m unittest discover -s tests -p test_windows_sdk_compat.py -v
          python -m unittest discover -s tests -p test_gn_smoke.py -v
          python -m unittest discover -s tests -p test_windows_browser_smoke.py -v
      - name: Check complete Windows SDK and local toolchain resources
        shell: pwsh
        run: ./scripts/windows_build_preflight.ps1
      - name: Stage exact pinned Helium-Windows and Arcium core
        run: python scripts/windows_port.py stage
      - name: Verify browser-only build adapter without source download
        run: python scripts/browser_only_build.py --validate
      - name: Install pinned Windows preparation dependencies
        run: python -m pip install requests Pillow
      - name: Attempt native chrome-only compilation with 26100 NTDDI fix
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/browser_only_build.py --execute --jobs 2 --max-minutes 260
      - name: Verify resulting chrome.exe using disposable headless profile
        run: python scripts/windows_browser_smoke.py --timeout 60
      - name: Upload diagnostic JSON and logs (never executable files)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arcium-windows-native-chrome-ntddi-retry
          path: |
            work/browser-only-build.json
            work/browser-only-build.log
            work/browser-launch-smoke.json
            work/windows-audit.json
            work/windows-toolchain-preflight.json
          if-no-files-found: warn
          retention-days: 7

# DO NOT MERGE this one-time diagnostic workflow. Never package, install,
# sign, update, or upload browser binaries. Only chrome target is attempted.
