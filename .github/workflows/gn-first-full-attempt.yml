name: One-time experimental full Windows GN generation

on:
  pull_request:
    paths:
      - .github/workflows/gn-first-full-attempt.yml

permissions:
  contents: read

jobs:
  full-gn:
    name: First complete Windows GN attempt (no Ninja)
    if: ${{ github.head_ref == 'experiment/gn-full-source-20261101' }}
    runs-on: windows-2025
    timeout-minutes: 92
    steps:
      - name: Checkout pinned integration sources
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run offline GN adapter tests
        run: python -m unittest discover -s tests -p test_gn_smoke.py -v
      - name: Read-only runner resource inspection
        shell: pwsh
        run: ./scripts/windows_build_preflight.ps1
      - name: Stage exact Helium-Windows and Arcium core revisions
        run: python scripts/windows_port.py stage
      - name: Validate pinned GN-only adapter
        run: python scripts/gn_smoke.py --validate
      - name: Install pinned Windows builder helper dependencies
        run: python -m pip install requests Pillow
      - name: Execute full patch application and GN (never Ninja)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/gn_smoke.py --execute --max-minutes 75
      - name: Upload reports, never binaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arcium-gn-first-complete-attempt
          path: |
            work/gn-generation.json
            work/gn-generation.log
            work/windows-audit.json
            work/windows-toolchain-preflight.json
          if-no-files-found: warn
          retention-days: 7

# This one-time experimental workflow should NOT be merged into main.
# Running it does not sign, publish, install, or execute any browser.
