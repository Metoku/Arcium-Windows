name: Validate upstream tracking

on:
  push:
    branches:
      - main
      - "automation/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-metadata:
    name: Source metadata (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run offline validation unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate pinned revision format
        run: python scripts/validate_upstream.py
      - name: Fetch exact Arcium source on Windows (not a browser build)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: ./scripts/fetch_core.ps1
      - name: Verify pinned upstream revision exists
        if: matrix.os == 'ubuntu-latest'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/validate_upstream.py --check-remote

# This metadata workflow does not compile Chromium or upload browser binaries.
# Native builds and installer acceptance have their own checks and release records.
