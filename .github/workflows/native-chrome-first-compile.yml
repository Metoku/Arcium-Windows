name: One-time Windows Chromium browser-only native compilation

on:
  pull_request:
    paths:
      - .github/workflows/native-chrome-first-compile.yml

permissions:
  contents: read

concurrency:
  group: arcium-first-windows-chrome-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  browser-only:
    name: Compile Chromium chrome target only (never installer)
    if: ${{ github.head_ref == 'experiment/first-windows-chrome-compile-20261102' }}
    runs-on: windows-2025
    timeout-minutes: 300
    steps:
      - name: Checkout pinned Arcium Windows integration
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate browser-only target and Windows SDK build guards
        run: |
          python -m unittest discover -s tests -p test_browser_only_build.py -v
          python -m unittest discover -s tests -p test_gn_smoke.py -v
          python -m unittest discover -s tests -p test_windows_sdk_compat.py -v
          python -m unittest discover -s tests -p test_chromium_sdk_pin.py -v
          python -m unittest discover -s tests -p test_windows_browser_smoke.py -v
      - name: Inspect Windows toolchain and available disk
        shell: pwsh
        run: ./scripts/windows_build_preflight.ps1
      - name: Stage pinned Helium-Windows and Arcium patches
        run: python scripts/windows_port.py stage
      - name: Verify browser-only build script (no download or compile)
        run: python scripts/browser_only_build.py --validate
      - name: Install Windows upstream build helpers
        run: python -m pip install requests Pillow
      - name: Compile only the chrome target with no updater or installer
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/browser_only_build.py --execute --jobs 2 --max-minutes 265
      - name: Smoke-launch resulting browser with disposable profile
        run: python scripts/windows_browser_smoke.py --timeout 60
      - name: Upload diagnostic logs and reports only (never binaries)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arcium-windows-first-native-chrome-compile
          path: |
            work/browser-only-build.json
            work/browser-only-build.log
            work/browser-launch-smoke.json
            work/windows-audit.json
            work/windows-toolchain-preflight.json
          if-no-files-found: warn
          retention-days: 7

# One-time diagnostic PR only, do not merge workflow into main.
# Only chrome target is compiled. No setup, mini_installer, code signing,
# updater, machine installation, user profile reuse or binary artifact upload.
