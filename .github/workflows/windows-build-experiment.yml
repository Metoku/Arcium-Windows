name: Windows source staging and experimental build

on:
  pull_request:
  workflow_dispatch:
    inputs:
      compile_browser:
        type: boolean
        description: "Experimental Chromium compilation (heavy; requires substantial disk/RAM)"
        default: false
        required: true
      runner:
        type: choice
        description: "Windows runner; hosted runners may lack disk/time for Chromium"
        options:
          - windows-2025
          - self-hosted
        default: windows-2025
        required: true

permissions:
  contents: read

concurrency:
  group: windows-experiment-${{ github.ref }}
  cancel-in-progress: false

jobs:
  stage-and-optional-compile:
    name: "Pinned Windows port candidate"
    runs-on: ${{ inputs.runner || 'windows-2025' }}
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inspect Windows runner resources and toolchain
        shell: pwsh
        run: ./scripts/windows_build_preflight.ps1
      - name: Upload Windows runner preflight
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-runner-preflight
          path: work/windows-toolchain-preflight.json
          if-no-files-found: warn
      - name: Run offline Windows bootstrap tests
        run: python -m unittest discover -s tests -v
      - name: Show exact pinned source revisions
        run: python scripts/windows_port.py plan
      - name: Stage Helium Windows platform with Arcium shared core
        run: python scripts/windows_port.py stage
      - name: Replay optional Windows Arc integration patches
        run: python -m scripts.check_windows_arc_import_patch --core-dir work/windows-platform/helium-chromium --platform-dir work/windows-platform
      - name: Upload optional Arc patch replay report (NOT a build)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-arc-import-patch-replay
          path: work/windows-arc-import-replay.json
          if-no-files-found: warn
      - name: Validate full-source preparation adapter (no downloads)
        run: python scripts/prepare_full_chromium.py --validate
      - name: Validate browser-only compilation adapter (no download or build)
        run: python scripts/browser_only_build.py --validate
      - name: Upload static compatibility audit (NOT a build)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-source-audit
          path: work/windows-audit.json
          if-no-files-found: warn
      - name: Ensure appropriate resources before Chromium compilation
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.compile_browser }}
        shell: pwsh
        run: |
          $drive = Get-PSDrive -Name ((Get-Location).Drive.Name)
          $freeGiB = [math]::Round($drive.Free / 1GB, 1)
          Write-Host "Free disk: $freeGiB GiB"
          if ($freeGiB -lt 100) {
            throw "Need at least 100 GiB free for this experimental Chromium build. Configure a large Windows self-hosted runner."
          }
      - name: Install Python requirements for Helium Windows builder
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.compile_browser }}
        run: python -m pip install requests Pillow
      - name: Attempt browser-only native Chromium build (NO installer or distribution)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.compile_browser }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/browser_only_build.py --execute --jobs 2 --max-minutes 250
      - name: Upload diagnostic report and log (NO browser binaries)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-browser-only-build-report
          path: |
            work/browser-only-build.json
            work/browser-only-build.log
          if-no-files-found: warn
          retention-days: 7
