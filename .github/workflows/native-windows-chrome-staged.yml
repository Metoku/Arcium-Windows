name: Windows native chrome staged compilation (standard runner, cached)

# Only the initial merge of this exact workflow triggers a cache warm-up.
# Subsequent stages must be started manually on main to reuse its cache.
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/native-windows-chrome-staged.yml
  workflow_dispatch:
    inputs:
      compile_minutes:
        description: "Native build time budget per stage (minutes)"
        required: true
        type: choice
        default: "120"
        options:
          - "60"
          - "120"
          - "180"
          - "240"

permissions:
  contents: read

concurrency:
  group: arcium-standard-windows-staged-main
  cancel-in-progress: false

jobs:
  cache-native-chrome:
    name: Cache verified Chromium compilation (standard Windows, no installer)
    runs-on: windows-2025
    timeout-minutes: 290
    env:
      STAGE_MINUTES: ${{ inputs.compile_minutes || '120' }}
      SCCACHE_GHA_ENABLED: "on"
      SCCACHE_GHA_VERSION: "chromium-156-windows-sdk28000-v1"
    steps:
      - name: Checkout pinned Arcium Windows integration
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate browser-only, SDK and smoke-test safety adapters
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p test_browser_only_build.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p test_chromium_sdk_pin.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p test_windows_sdk_compat.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p test_windows_browser_smoke.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Confirm standard Windows machine is suitable for cache warm-up
        shell: pwsh
        run: |
          $logical = [Environment]::ProcessorCount
          $ram = [math]::Round((Get-CimInstance Win32_ComputerSystem).TotalPhysicalMemory / 1GB,1)
          $drive = [System.IO.Path]::GetPathRoot($env:GITHUB_WORKSPACE)
          $disk = [math]::Round(([System.IO.DriveInfo]::new($drive)).AvailableFreeSpace / 1GB,1)
          Write-Host "Windows cache-warmup runner: $logical CPUs; $ram GiB RAM; $disk GiB free disk"
          if ($logical -lt 2 -or $ram -lt 13 -or $disk -lt 115) {
            throw "Insufficient disk/memory for bounded cache warming"
          }
          $minutes = [int]$env:STAGE_MINUTES
          if ($minutes -notin @(60,120,180,240)) {
            throw "Unexpected compilation stage duration; allowed 60/120/180/240"
          }
          Write-Host "Stage budget: $minutes minutes, 3 compile jobs"
      - name: Install GitHub-backed sccache (compiled objects persist across main runs)
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: "v0.16.0"
      - name: Give sccache GitHub Actions cache service credentials
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
      - name: Reject uncached build if cache credentials are unavailable
        shell: pwsh
        run: |
          Get-Command sccache -ErrorAction Stop | Select-Object -ExpandProperty Source
          sccache --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!$env:ACTIONS_RESULTS_URL -or !$env:ACTIONS_RUNTIME_TOKEN) {
            throw "Missing GitHub Actions cache credentials. Refusing another uncached 5-hour build."
          }
          Write-Host "GitHub Actions cache backend enabled (no tokens printed)."
      - name: Install only official Microsoft-signed SDK 28000
        shell: pwsh
        run: ./scripts/provision_chromium_sdk.ps1 -Install
      - name: Validate complete SDK 28000 and Chromium BR definitions
        shell: pwsh
        run: |
          ./scripts/provision_chromium_sdk.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $header = 'C:\Program Files (x86)\Windows Kits\10\Include\10.0.28000.0\shared\sdkddkver.h'
          if (!(Select-String -LiteralPath $header -Pattern '^\s*#\s*define\s+NTDDI_WIN11_BR\b' -Quiet)) {
            throw "Missing Chromium-required NTDDI_WIN11_BR macro"
          }
      - name: Stage reviewed pinned Windows and Arcium source
        shell: pwsh
        run: |
          python scripts/windows_port.py stage
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validate exact browser-only builder without running Ninja
        shell: pwsh
        run: |
          python scripts/browser_only_build.py --validate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install source preparation dependencies
        shell: pwsh
        run: python -m pip install requests Pillow
      - name: Compile for a bounded stage, feeding persistent compiler cache
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $minutes = [int]$env:STAGE_MINUTES
          python scripts/browser_only_build.py --execute --require-cache --jobs 3 --max-minutes $minutes
          $rc = $LASTEXITCODE
          if ($rc -eq 0) {
            Write-Host "ARCIUM_STANDARD_WINDOWS_FULL_CHROME_BUILD_PASSED"
            "ARCIUM_STAGE_RESULT=browser_built" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            exit 0
          }
          if ($rc -eq 124) {
            Write-Host "ARCIUM_STANDARD_WINDOWS_CACHE_STAGE_ENDED: expected time-budget exit; browser not compiled."
            Write-Host "Only cached eligible compiler outputs persist. The GN/Ninja build directory is not saved."
            "ARCIUM_STAGE_RESULT=cache_stage_finished" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            exit 0
          }
          throw "Chromium native build reported an unexpected error (exit code $rc); inspect first compiler failure."
      - name: Verify chrome with a disposable headless browser profile
        if: ${{ env.ARCIUM_STAGE_RESULT == 'browser_built' }}
        shell: pwsh
        run: |
          python scripts/windows_browser_smoke.py --timeout 60
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Print compiler-cache hits, misses and errors
        if: always()
        shell: pwsh
        run: |
          if (Get-Command sccache -ErrorAction SilentlyContinue) {
            sccache --show-stats
          }
      - name: Upload stage JSON and compiler log (never executables)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arcium-standard-windows-cache-stage-${{ github.run_number }}
          path: |
            work/browser-only-build.json
            work/browser-only-build.log
            work/browser-launch-smoke.json
            work/windows-audit.json
          if-no-files-found: warn
          retention-days: 7

# Deliberately does NOT build setup/mini_installer, sign, update, install,
# upload chrome.exe, or use an existing personal Chrome/Helium profile.
